services:
  transaction-service:
    build:
      context: .
      # args: { SKIP_TESTS: "false" }   # run the test suite inside the image build
    image: transaction-service:local
    container_name: transaction-service
    ports:
      - "8080:8080"
    environment:
      # any application.yml property can be overridden here (relaxed binding)
      SPRING_PROFILES_ACTIVE: docker        # JSON (ECS) logs; drop it for the human-readable pattern
      RECONCILIATION_STALE_AFTER: 2m
      HTTP_PAYLOAD_LOGGING_ENABLED: "true"
      LOGGING_LEVEL_COM_ASSESSMENT_TRANSACTIONS: DEBUG
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3
    # graceful shutdown: in-flight requests finish and the consumer drains its queue (up to 20s + 10s)
    stop_grace_period: 40s
    restart: unless-stopped
