spring:
  application:
    name: transaction-service
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

transactions:
  # how long POST /transactions waits for the consumer before answering from the CREATED event
  projection-timeout: 5s

events:
  consumer:
    # delivery attempts before an event is dead-lettered, and the pause between attempts
    max-attempts: 3
    retry-backoff: 100ms
    # on shutdown, how long to keep consuming already-published events
    drain-timeout: 10s

reconciliation:
  # non-terminal transactions older than this are reported as stale
  stale-after: 2m

server:
  port: 8080
  # stop accepting requests, finish in-flight ones, then destroy beans (the event bus drains its queue)
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: 20s

health:
  consumer:
    # how long /actuator/health waits for the consumer thread to answer a no-op before reporting DEGRADED
    ping-timeout: 2s

springdoc:
  # live spec: /v3/api-docs (JSON) and /v3/api-docs.yaml; UI: /swagger-ui.html
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      status:
        # DEGRADED: something needs an operator (dead letters, slow consumer) but restarting would not help
        order: DOWN,OUT_OF_SERVICE,DEGRADED,UP,UNKNOWN
        http-mapping:
          DEGRADED: 200
  metrics:
    tags:
      application: transaction-service

http:
  payload-logging:
    # request/response bodies on the http.payload logger (DEBUG); truncated beyond max-length chars
    enabled: true
    max-length: 2048

logging:
  level:
    com.assessment.transactions: DEBUG
    http.access: INFO
    http.payload: DEBUG
  pattern:
    # every line carries the tracing identifiers from the MDC (see logging.TraceContext)
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%-26.26t] %-36.36logger{36} cid=%X{correlationId:--} tx=%X{transactionId:--} seq=%X{sequence:--} key=%X{idempotencyKey:--} : %m%n%wEx"
