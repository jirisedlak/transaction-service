spring:
  application:
    name: transaction-service
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

reconciliation:
  # non-terminal transactions older than this are reported as stale
  stale-after: 2m

server:
  port: 8080

springdoc:
  # live spec: /v3/api-docs (JSON) and /v3/api-docs.yaml; UI: /swagger-ui.html
  writer-with-order-by-keys: true
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

http:
  payload-logging:
    # request/response bodies on the http.payload logger (DEBUG); truncated beyond max-length chars
    enabled: true
    max-length: 2048

logging:
  level:
    com.assessment.transactions: DEBUG
    http.access: INFO
    http.payload: DEBUG
  pattern:
    # every line carries the tracing identifiers from the MDC (see logging.TraceContext)
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%-26.26t] %-36.36logger{36} cid=%X{correlationId:--} tx=%X{transactionId:--} seq=%X{sequence:--} key=%X{idempotencyKey:--} : %m%n%wEx"
